<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="p03-5-title p03-5-desc"><title id="p03-5-title">P03 • action 5 • Add the red LED</title><desc id="p03-5-desc">Connect the free resistor end to the LED anode; keep its cathode in a separate strip.</desc><rect width="1000" height="620" rx="24" fill="#fff8e9"/><style>text{font:20px sans-serif;fill:#172a42}.small{font-size:16px}.wire{fill:none;stroke:#172a42;stroke-width:4}.focus{fill:#d9f2fa;stroke:#11667e;stroke-width:4}.part{fill:white;stroke:#172a42;stroke-width:3}</style><text x="36" y="44" font-weight="bold">P03 • action 5 • Add the red LED</text><text x="36" y="84" class="small">Arduino Uno R3 • 5 V logic only • unplug USB before rewiring</text><rect x="40" y="160" width="200" height="280" rx="10" class="part"/><text x="52" y="306.0">Uno R3</text><rect x="430" y="160" width="300" height="70" rx="10" class="part"/><text x="442" y="201.0">Normally-open A / B</text><rect x="430" y="300" width="180" height="70" rx="10" class="part"/><text x="442" y="341.0">220 Ω</text><rect x="720" y="300" width="230" height="70" rx="10" class="focus"/><text x="732" y="341.0">Red LED A → K</text><path class="wire" d="M240 190 H430 M730 195 H970 V460 H240 M240 335 H430 M610 335 H720 M950 335 H970"/><text x="260" y="178">D2 → A</text><text x="260" y="323">D9</text><text x="760" y="440">GND return</text><text x="280" y="505">Button released: HIGH; pressed: LOW. Output LED on for LOW.</text><text x="36" y="120" class="small">Stage 5: Add the red LED</text><text x="36" y="585" class="small">Original connection schematic — not a breadboard layout. Read the connection table.</text></svg>