<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="m01-1-title m01-1-desc"><title id="m01-1-title">M01 • action 1 • Set the base</title><desc id="m01-1-desc">Tape the precut 30 × 15 cm cardboard base flat on the table.</desc><rect width="1000" height="620" rx="24" fill="#fff8e9"/><style>text{font:20px sans-serif;fill:#172a42}.small{font-size:16px}.wire{fill:none;stroke:#172a42;stroke-width:4}.focus{fill:#d9f2fa;stroke:#11667e;stroke-width:4}.part{fill:white;stroke:#172a42;stroke-width:3}</style><text x="36" y="44" font-weight="bold">M01 • action 1 • Set the base</text><text x="36" y="84" class="small">Mechanical only; adult-prepared pivot</text><rect x="60" y="450" width="870" height="50" rx="10" class="focus"/><text x="72" y="481.0">Stable base; arm moves above it</text><path d="M90 265 H900" stroke="#172a42" stroke-width="28"/><path d="M340 290 L300 420 H380 Z" fill="#f1bc3b" stroke="#172a42" stroke-width="3"/><circle cx="340" cy="265" r="18" fill="#11667e"/><text x="70" y="190">Load at 2 cm</text><text x="260" y="225">Pivot 8 cm</text><text x="500" y="180">Push 14 cm</text><text x="740" y="225">Push 22 cm</text><path class="wire" d="M150 210 V265 M550 195 V265 M850 240 V265"/><text x="100" y="345">Load arm 6 cm</text><text x="440" y="345">Effort arms 6 cm / 14 cm</text><text x="80" y="545">Push down on right → load rises on left; keep fingers away from pivot.</text><text x="36" y="120" class="small">Stage 1: Set the base</text><text x="36" y="585" class="small">Original connection schematic — not a breadboard layout. Read the connection table.</text></svg>