<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="i02-2-title i02-2-desc"><title id="i02-2-title">I02 • action 2 • Map the expected loop</title><desc id="i02-2-desc">Trace the paper reference + → 220 Ω → anode → cathode → −. Keep the battery disconnected.</desc><rect width="1000" height="620" rx="24" fill="#fff8e9"/><style>text{font:20px sans-serif;fill:#172a42}.small{font-size:16px}.wire{fill:none;stroke:#172a42;stroke-width:4}.focus{fill:#d9f2fa;stroke:#11667e;stroke-width:4}.part{fill:white;stroke:#172a42;stroke-width:3}</style><text x="36" y="44" font-weight="bold">I02 • action 2 • Map the expected loop</text><text x="36" y="84" class="small">3 V • 2×AA alkaline only • disconnect before rewiring</text><path class="wire" d="M160 230 H250 M470 230 H580 M800 230 H900 V430 H160 V290"/><rect x="50" y="200" width="150" height="90" rx="10" class="part"/><text x="62" y="251.0">2×AA: + / −</text><rect x="250" y="190" width="220" height="80" rx="10" class="part"/><text x="262" y="236.0">220 Ω resistor</text><rect x="580" y="190" width="220" height="80" rx="10" class="focus"/><text x="592" y="236.0">Red LED A → K</text><text x="274" y="172">series current limit</text><text x="610" y="302">A = anode (+)</text><text x="610" y="334">K = cathode (−)</text><text x="300" y="414">Return to battery −; no bypass path</text><text x="50" y="490">Reference: known-good loop. Adult plants ONE open/polarity fault.</text><text x="36" y="120" class="small">Stage 2: Map the expected loop</text><text x="36" y="585" class="small">Original connection schematic — not a breadboard layout. Read the connection table.</text></svg>