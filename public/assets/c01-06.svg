<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="c01-6-title c01-6-desc"><title id="c01-6-title">C01 • action 6 • Inspect the path</title><desc id="c01-6-desc">An adult traces + → resistor → anode → cathode → − and checks for shorts and exposed loose ends.</desc><rect width="1000" height="620" rx="24" fill="#fff8e9"/><style>text{font:20px sans-serif;fill:#172a42}.small{font-size:16px}.wire{fill:none;stroke:#172a42;stroke-width:4}.focus{fill:#d9f2fa;stroke:#11667e;stroke-width:4}.part{fill:white;stroke:#172a42;stroke-width:3}</style><text x="36" y="44" font-weight="bold">C01 • action 6 • Inspect the path</text><text x="36" y="84" class="small">3 V • 2×AA alkaline only • disconnect before rewiring</text><path class="wire" d="M160 230 H250 M470 230 H580 M800 230 H900 V430 H160 V290"/><rect x="50" y="200" width="150" height="90" rx="10" class="part"/><text x="62" y="251.0">2×AA: + / −</text><rect x="250" y="190" width="220" height="80" rx="10" class="part"/><text x="262" y="236.0">220 Ω resistor</text><rect x="580" y="190" width="220" height="80" rx="10" class="part"/><text x="592" y="236.0">Red LED A → K</text><text x="274" y="172">series current limit</text><text x="610" y="302">A = anode (+)</text><text x="610" y="334">K = cathode (−)</text><text x="300" y="414">Return to battery −; no bypass path</text><text x="36" y="120" class="small">Stage 6: Inspect the path</text><text x="36" y="585" class="small">Original connection schematic — not a breadboard layout. Read the connection table.</text></svg>