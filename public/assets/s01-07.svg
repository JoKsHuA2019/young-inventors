<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="s01-7-title s01-7-desc"><title id="s01-7-title">S01 • action 7 • Inspect and read</title><desc id="s01-7-desc">Adult checks 5 V → LDR → J → 10 kΩ → GND and A0 → J. Connect USB, upload robot_eye.ino, open Serial at 9600 and compare shade/room readings.</desc><rect width="1000" height="620" rx="24" fill="#fff8e9"/><style>text{font:20px sans-serif;fill:#172a42}.small{font-size:16px}.wire{fill:none;stroke:#172a42;stroke-width:4}.focus{fill:#d9f2fa;stroke:#11667e;stroke-width:4}.part{fill:white;stroke:#172a42;stroke-width:3}</style><text x="36" y="44" font-weight="bold">S01 • action 7 • Inspect and read</text><text x="36" y="84" class="small">Arduino Uno R3 • 5 V logic only • unplug USB before rewiring</text><rect x="50" y="150" width="210" height="300" rx="10" class="focus"/><text x="62" y="306.0">Uno R3</text><rect x="470" y="150" width="250" height="70" rx="10" class="part"/><text x="482" y="191.0">LDR (upper)</text><rect x="470" y="355" width="250" height="70" rx="10" class="part"/><text x="482" y="396.0">10 kΩ (lower)</text><path class="wire" d="M260 175 H470 M720 185 H870 V390 H720 M470 390 H360 V440 H260 M260 290 H870"/><circle cx="870" cy="290" r="8" fill="#11667e"/><text x="280" y="162">5 V</text><text x="280" y="277">A0 → J</text><text x="880" y="295">J</text><text x="280" y="472">GND</text><text x="400" y="510">Brighter → lower LDR resistance → usually higher A0.</text><text x="36" y="120" class="small">Stage 7: Inspect and read</text><text x="36" y="585" class="small">Original connection schematic — not a breadboard layout. Read the connection table.</text></svg>